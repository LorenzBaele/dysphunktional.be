<!doctype html>
<html lang="nl-BE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pagina niet gevonden – Dysphunktional</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a2a30">
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">

<style>
/* GitHub Pages shows this page for any address that doesn't exist, at that address, so every link here starts at the root (/) */
@font-face{font-family:'Outfit';src:url(/fonts/outfit-latin.woff2) format('woff2');font-weight:400 600;font-display:swap}
:root{--ink:#0a2a30;--cream:#f2e8d3;--muted:#a9bdb8;--mist:#d9d3c7;--olive:#8c8945;--teal:#1b8791;--mustard:#dfa328;--coral:#dd523b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:32px 24px;text-align:center;background:var(--ink);color:var(--cream);font-family:'Outfit','Segoe UI',system-ui,sans-serif;font-size:1.0625rem;line-height:1.6}
.badge{width:72px;height:72px;border-radius:50%;border:3px solid var(--cream);
  background:linear-gradient(160deg,#0a1416 0 14%,var(--mist) 14% 26%,#0a1416 26% 30%,var(--olive) 30% 42%,#0a1416 42% 46%,var(--teal) 46% 58%,#0a1416 58% 62%,var(--mustard) 62% 74%,#0a1416 74% 78%,var(--coral) 78% 90%,#0a1416 90%)}
h1{margin:0;font-size:clamp(1.8rem,6vw,2.6rem);font-weight:600;line-height:1.15}
p{margin:0;color:var(--muted);max-width:28em}
a{display:inline-block;margin-top:6px;padding:.55em 1.4em;border-radius:999px;background:var(--mustard);color:#071d22;font-weight:600;text-decoration:none;transition:background .2s}
a:hover{background:var(--cream)}
a:focus-visible{outline:3px solid var(--cream);outline-offset:3px}
</style>
</head>
<body>
  <span class="badge" aria-hidden="true"></span>
  <h1>Deze pagina bestaat niet</h1>
  <p>Misschien is de link verouderd of zit er een typfout in het adres. Alles over Dysphunktional vind je op de homepage.</p>
  <a href="/">Naar de homepage</a>
</body>
</html>
